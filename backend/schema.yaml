components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    CategoryStockResponse:
      type: object
      properties:
        category__name:
          type: string
          nullable: true
        units:
          type: integer
          nullable: true
        product_count:
          type: integer
      required:
      - category__name
      - product_count
      - units
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 30
        address:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        total_orders:
          type: integer
          readOnly: true
          default: 0
      required:
      - created_at
      - id
      - name
      - total_orders
    DashboardResponse:
      type: object
      properties:
        total_products:
          type: integer
        total_customers:
          type: integer
        stock_units:
          type: integer
        low_stock_count:
          type: integer
        total_orders:
          type: integer
        total_sales:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        stock_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        sales_trend:
          type: array
          items:
            $ref: '#/components/schemas/DashboardTrendResponse'
        recent_orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        low_stock_products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
      required:
      - low_stock_count
      - low_stock_products
      - recent_orders
      - sales_trend
      - stock_units
      - stock_value
      - total_customers
      - total_orders
      - total_products
      - total_sales
    DashboardTrendResponse:
      type: object
      properties:
        date:
          type: string
          format: date
        sales:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        orders:
          type: integer
      required:
      - date
      - orders
      - sales
    HealthResponse:
      type: object
