name: SmartStock CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smartstock-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartstock_ci
          POSTGRES_USER: smartstock
          POSTGRES_PASSWORD: smartstock_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartstock -d smartstock_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # CI-only values, not real credentials; service is isolated to this run.
      DJANGO_SECRET_KEY: ci-only-django-secret-not-for-production
      SECRET_KEY: ci-only-django-secret-not-for-production
      DJANGO_DEBUG: 'True'
      DEBUG: 'True'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://smartstock:smartstock_ci_password@127.0.0.1:5432/smartstock_ci
      DB_NAME: smartstock_ci
      DB_USER: smartstock
      DB_PASSWORD: smartstock_ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      POSTGRES_DB: smartstock_ci
      POSTGRES_USER: smartstock
      POSTGRES_PASSWORD: smartstock_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Django API tests
        run: python manage.py test --noinput

  web:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact web dependencies
        run: npm ci
      - name: Type-check and build web
        run: npm run build

  android:
    name: Expo Android TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install exact mobile dependencies
        run: npm ci
      - name: Type-check Android source
        run: npx tsc --noEmit
